<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5ee">
  <title>Notre Calendrier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-192.png">
  <link rel="apple-touch-icon" href="icons/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendrier">
  <link rel="stylesheet" href="style.css">
  <script>
    // Thème posé avant l'affichage (pas de flash blanc la nuit) : choix enregistré, sinon celui du téléphone.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* stockage bloqué */ }
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/app-192.png" alt=""><span>Notre Calendrier</span></div>
    <div class="top-actions">
      <button id="sync" class="sync" type="button" aria-label="Actualiser"></button>
      <button id="theme" class="theme-btn" type="button" aria-label="Mode nuit"></button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M12 17.6c-2.4-1.5-3.4-2.6-3.4-3.8 0-.9.7-1.6 1.6-1.6.7 0 1.3.4 1.8 1 .5-.6 1.1-1 1.8-1 .9 0 1.6.7 1.6 1.6 0 1.2-1 2.3-3.4 3.8z" fill="currentColor" stroke="none"/></svg>Calendrier</button>
    <button type="button" data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11"/><circle cx="5" cy="18" r="1.3"/></svg>Listes</button>
    <button type="button" data-tab="questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5v-3.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><path d="M10 10a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4"/><circle cx="12" cy="15.2" r=".4" fill="currentColor"/></svg>Questions</button>
    <button type="button" data-tab="memories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="M4 18l5-4.5 3.5 3 3-2.5L20 18"/></svg>Souvenirs</button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.5" rx="4.6" ry="3.9"/><ellipse cx="6" cy="10.5" rx="2" ry="2.6"/><ellipse cx="9.6" cy="6.6" rx="2" ry="2.6"/><ellipse cx="14.4" cy="6.6" rx="2" ry="2.6"/><ellipse cx="18" cy="10.5" rx="2" ry="2.6"/></svg>Plus</button>
  </nav>
  <button id="fab" class="fab" type="button" aria-label="Nouvel événement" hidden>+</button>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <form class="sheet-panel" id="sheet-form" novalidate></form>
  </div>
  <div id="lightbox" class="lightbox" hidden></div>
  <input id="photo-input" type="file" accept="image/*" multiple hidden>
  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="animals.js"></script>
  <script src="api.js"></script>
  <script src="excel.js"></script>
  <script src="duo.js"></script>
  <script src="app.js"></script>
</body>
</html>
